[package]
name = "analyzator-rs"
version = "0.1.0"
edition = "2021"
description = "Analyzátor zvukových súborov – rýchla Rust verzia (rovnaký CLAP model)"
license = "MIT"

[features]
# DirectML = GPU akcelerácia na Windows (AMD/NVIDIA/Intel). Zapnúť pri builde
# pre Windows: cargo build --release --features ort-directml
ort-directml = ["ort/directml"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ndarray = "0.16"
ort = { version = "=2.0.0-rc.10", features = ["ndarray"] }
symphonia = { version = "0.5", features = ["mp3", "flac", "ogg", "vorbis", "wav", "pcm"] }
rustfft = "6"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
id3 = "1"
lofty = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"
