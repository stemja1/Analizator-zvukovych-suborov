[package]
name = "analyzator-rs"
version = "0.10.1"
edition = "2021"
description = "Analyzátor zvukových súborov – rýchla Rust verzia (rovnaký CLAP model)"
license = "MIT"

[features]
# Predvolené: ONNX Runtime sa vkompiluje (stiahne sa preklad pre daný systém).
default = ["ort-static"]
ort-static = ["ort/download-binaries", "ort/copy-dylibs"]
# DirectML = GPU akcelerácia na Windows (AMD/NVIDIA/Intel). Zapnúť pri builde
# pre Windows: cargo build --release --target x86_64-pc-windows-gnu
#   --no-default-features --features "ort-directml,ort-load-dynamic"
ort-directml = ["ort/directml"]
# onnxruntime.dll sa NEvkompilováva, ale načíta za behu (onnxruntime.dll
# priľahlo k programu) – používané pre Windows build
ort-load-dynamic = ["ort/load-dynamic"]

[[bin]]
name = "analyzator-rs"
path = "src/main.rs"

[[bin]]
name = "analyzator-gui"
path = "src/gui.rs"

[dependencies]
eframe = "0.28"
egui_extras = "0.28"
ureq = { version = "2", features = ["json"] }
rfd = "0.14"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ndarray = "0.16"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "tracing"] }
symphonia = { version = "0.5", features = ["mp3", "flac", "ogg", "vorbis", "wav", "pcm"] }
rustfft = "6"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
id3 = "1"
lofty = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"
